<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wrolly-AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B8CFF"/><stop offset=".55" stop-color="#FF9EC7"/><stop offset="1" stop-color="#8CF5D2"/>
    </linearGradient>
    <symbol id="logo" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="14" fill="url(#lg)"/>
      <path d="M12 19l5.5 15L24 23l6.5 11L36 19" fill="none" stroke="#120F2E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M37 4Q37.8 9.2 43 10Q37.8 10.8 37 16Q36.2 10.8 31 10Q36.2 9.2 37 4Z" fill="#fff"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <header>
    <div class="brand">
      <svg class="logo"><use href="#logo"/></svg>
      <div><h1>Wrolly-AI</h1><small>Ask me anything</small></div>
    </div>
    <button type="button" id="clear" class="ghost" aria-label="Delete history" title="Delete history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>
      <span>Delete history</span>
    </button>
  </header>

  <main id="log" aria-live="polite">
    <section class="hero" id="hero">
      <svg class="logo big"><use href="#logo"/></svg>
      <h2>Hi, I’m Wrolly-AI</h2>
      <p>Ask me about code, writing, research, ideas, homework, or anything else on your mind.</p>
      <div class="chips">
        <button class="chip">Explain how the internet works in simple terms</button>
        <button class="chip">Write a Python function to check for palindromes</button>
        <button class="chip">Plan a 3-day trip to Tokyo on a budget</button>
        <button class="chip">Give me tips to prepare for a job interview</button>
      </div>
    </section>
  </main>

  <form id="form" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Message Wrolly-AI…" aria-label="Message"></textarea>
    <button class="send" id="send" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <p class="note">Wrolly-AI can make mistakes. Check important information.</p>
</div>

<script src="app.js"></script>
</body>
</html>
